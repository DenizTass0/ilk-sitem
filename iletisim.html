<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header>
        <h1>DENİZ TAŞ</h1>
        <nav>
            <a href="index.html"><i class="fa-solid fa-house"></i> Anasayfa</a>
            <a href="hobilerim.html"><i class="fa-solid fa-gamepad"></i> Hobilerim</a>
            <a href="iletisim.html" class="aktif"><i class="fa-solid fa-envelope"></i> İletişim</a>
        </nav>
    </header>

    <main>
        <h2>Bana Ulaşın</h2>
        <p>Aşağıdaki formu doldurarak bana mesaj gönderebilirsiniz.</p>

        <form>
            <table>
                <tr>
                    <td>Adınız :</td>
                    <td><input type="text" name="ad"></td>
                </tr>
                <tr>
                    <td>Soyadınız :</td>
                    <td><input type="text" name="soyad"></td>
                </tr>
                <tr>
                    <td>Email Adresiniz :</td>
                    <td><input type="email" name="email"></td>
                </tr>
                <tr>
                    <td>Şifreniz :</td>
                    <td><input type="password" name="sifre"></td>
                </tr>
                <tr>
                    <td>Cinsiyet :</td>
                    <td>
                        <input type="radio" name="cinsiyet" value="erkek"> Erkek
                        <input type="radio" name="cinsiyet" value="kadin"> Kadın
                    </td>
                </tr>
                <tr>
                    <td>Doğum Tarihiniz :</td>
                    <td><input type="date" name="dogum"></td>
                </tr>
                <tr>
                    <th colspan="2">Hobiler</th>
                </tr>
                <tr>
                    <td>Kitap Okumak :</td>
                    <td><input type="checkbox" name="hobi" value="kitap"></td>
                </tr>
                <tr>
                    <td>PS5 Oynamak :</td>
                    <td><input type="checkbox" name="hobi" value="ps5"></td>
                </tr>
                <tr>
                    <td>Gezmek :</td>
                    <td><input type="checkbox" name="hobi" value="gezmek"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        Mesajınız:<br>
                        <textarea name="mesaj" cols="40" rows="5"></textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2"><button type="submit">Gönder</button></td>
                </tr>
            </table>
        </form>
    </main>

</html>
